name: Captures d'écran

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/captures.yml
      - .github/captures.sh

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Émulateur et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -change-locale fr-FR
          script: bash .github/captures.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/

      - name: Enregistrer les captures dans docs/ecrans
        run: |
          sudo apt-get install -y -q imagemagick >/dev/null
          mkdir -p docs/ecrans
          rm -f docs/ecrans/*.jpg
          for f in captures/*.png; do
            convert "$f" -resize 540x -quality 85 "docs/ecrans/$(basename "${f%.png}").jpg"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ecrans
          git diff --cached --quiet || git commit -m "Captures d'écran de l'application [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
