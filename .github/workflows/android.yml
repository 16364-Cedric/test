name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du serveur de supervision
        run: npm test

  server-image:
    needs: server
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image Docker du serveur (ghcr.io)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dati-supervision:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image" server
          docker push "$image"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secrets facultatifs : sans eux, l'APK publiée est signée avec la clé de debug du dépôt.
      DATI_KEYSTORE_BASE64: ${{ secrets.DATI_KEYSTORE_BASE64 }}
      DATI_KEYSTORE_PASSWORD: ${{ secrets.DATI_KEYSTORE_PASSWORD }}
      DATI_KEY_ALIAS: ${{ secrets.DATI_KEY_ALIAS }}
      DATI_KEY_PASSWORD: ${{ secrets.DATI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature de production
        if: env.DATI_KEYSTORE_BASE64 != ''
        run: |
          echo "$DATI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "DATI_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Tests et compilation de l'APK
        run: |
          tasks=":core:test :app:assembleDebug"
          if [ -n "$DATI_KEYSTORE_FILE" ]; then tasks="$tasks :app:assembleRelease"; fi
          ./gradlew $tasks --stacktrace

      - name: Choix de l'APK à publier
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dati.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk dati.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dati-apk
          path: dati.apk

      # Lien de téléchargement direct et stable :
      # https://github.com/<propriétaire>/<dépôt>/releases/download/dati-latest/dati.apk
      - name: Publier l'APK dans la release « dati-latest »
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dati-latest --yes --cleanup-tag || true
          gh release create dati-latest dati.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "DATI – dernière version" \
            --notes "APK compilée automatiquement depuis le commit $GITHUB_SHA."
